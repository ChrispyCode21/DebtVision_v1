# Quality gate for every PR and every push to main. "Checks" is a required status check on main
# (see .github/rulesets/main.json). Actions are pinned to full commit SHAs (version in the comment);
# Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # Worker and D1 gates (SPEC 9.11). Lint (`eslint .`), Type-check (`tsc -b`) and the Worker unit
      # tests (`vitest run` finds worker/**/*.test.ts) already cover the Worker through the steps above.
      # The steps below add what they cannot, and each runs once its files exist so CI stays green
      # while the V2 migration lands. wrangler comes from the lockfile (`--no-install`), never a fresh
      # download; none of these steps needs Cloudflare credentials.
      - name: Type-check the Worker on its own
        # An explicit project check, so a missing tsconfig reference can't silently skip the Worker.
        if: ${{ hashFiles('tsconfig.worker.json') != '' }}
        run: npx --no-install tsc -p tsconfig.worker.json --noEmit
      - name: Validate and bundle the Worker (wrangler dry run)
        # Catches what Workers Builds would reject: a bad wrangler.jsonc, a missing assets directory,
        # a binding that doesn't resolve, or a Worker that doesn't bundle.
        if: ${{ hashFiles('wrangler.jsonc') != '' }}
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run"
      - name: Apply migrations to a throwaway local D1
        # Every migration must apply cleanly, in order, to an empty database.
        if: ${{ hashFiles('migrations/*.sql') != '' }}
        run: npx --no-install wrangler d1 migrations apply DB --local
      - name: Audit production dependencies
        run: npm audit --omit=dev
